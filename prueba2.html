  <style>
    body {
      background-color: #f5c2cd;
      text-align: center;
      margin: 0;
      padding: 20px;
    }

    .caja {
      background-color: white;
      border: 2px solid #333;
      border-radius: 12px;
      padding: 20px;
      width: 300px;
      margin: 20px auto;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }

    .caja input {
      margin-bottom: 15px;
    }
  </style>
</head>
<body>

  <div class="caja">
    <h2>Regístrate</h2>
    <form>
      <label>Nombre:</label><br>
      <input type="text" placeholder="Escribe tu nombre"><br>

      <label>Correo electrónico:</label><br>
      <input type="email" placeholder="correo@ejemplo.com"><br>

      <label>Contraseña:</label><br>
      <input type="password" placeholder="Tu contraseña"><br>

      <button type="submit">Crear cuenta</button>
    </form>
  </div>

  <div class="caja">
    <h2>Inicia Sesión</h2>
    <form>
      <label>Correo electrónico:</label><br>
      <input type="email" placeholder="correo@ejemplo.com"><br>

      <label>Contraseña:</label><br>
      <input type="password" placeholder="Tu contraseña"><br>

      <button type="submit">Entrar</button>
    </form>
  </div>

 
</body>
</html>
